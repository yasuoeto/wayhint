# The demo, as a script. ./scripts/demo reads this and records it; see demo/README.md for the
# schema and demo/HANDOFF.md's successor, docs/DECISIONS.md 0031, for why it works this way.
#
# Two rules to keep in mind when editing:
#   * every step waits for a *condition*, never for a number of seconds, so the recording is
#     the same on a slow machine;
#   * `hold` is how long the finished picture stays on screen, in seconds, and it is the only
#     thing that decides the length of the video.

output: {width: 1280, height: 720, fps: 30}
fonts: {ui: "Noto Sans CJK JP", mono: "Noto Sans Mono"}

# Where the compositor puts each terminal. `spawn` names one of these.
windows:
  - {title: Claude Code, x: 36, y: 52, width: 620, height: 430}
  - {title: vi, x: 104, y: 214, width: 560, height: 380}

steps:
  # --- 1. the overlay knows what is in front of you ------------------------------------------
  - id: open-terminal
    spawn:
      window: Claude Code
      argv: ["{demo_bin}/foot-wayhint", "{demo_bin}/claude"]
    wait_for:
      toplevel: '^foot\.p\d+$'
      context: {process_name: claude, active_sheet: claude-code}
      overlay: hidden
    caption:
      en: "A terminal, with Claude Code running in it"
      ja: "端末の中で Claude Code が動いている"
    hold: 2.0

  - id: show-hints
    key: super+h
    wait_for: {overlay: visible, label: "Claude Code", hints: 11}
    caption:
      en: "Super+H — the hints for the command in front of you, not for the terminal"
      ja: "Super+H — 端末ではなく、いま動いているコマンドの hint が出る"
    hold: 4.0

  - id: mixed-in
    cli: refresh
    wait_for: {overlay: visible, hints: 11}
    caption:
      en: "Below them: the terminal's own hints, filtered by tag, then the window manager's"
      ja: "その下に端末自身の hint(タグで絞り込み)、続いてウィンドウマネージャの hint"
    hold: 3.5

  # --- 2. it does not take the keyboard ------------------------------------------------------
  - id: keep-typing
    type: "/compact"
    precondition: {overlay: visible}
    wait_for: {overlay: visible}
    caption:
      en: "It never takes the keyboard: you keep typing into the application"
      ja: "キーボードは奪われない。そのまま元のアプリに入力できる"
    hold: 3.0

  # --- 3. search -----------------------------------------------------------------------------
  - id: open-search
    press: {button: search}
    precondition: {overlay: visible}
    wait_for: {button: done}
    caption:
      en: "Search, for a sheet that has grown"
      ja: "hint が増えてきたら検索する"
    hold: 1.2

  - id: type-search
    type: {en: "session", ja: "セッション"}
    wait_for: {overlay: visible, hints: 3}
    caption:
      en: "Titles, keys, commands, categories and tags are all searched"
      ja: "title・キー・コマンド・カテゴリ・タグのすべてが対象"
    hold: 3.0

  - id: close-search
    key: escape
    wait_for: {button: search, hints: 11}
    caption:
      en: "Escape gives the keyboard back to the application"
      ja: "Esc でキーボードはアプリに戻る"
    hold: 1.5

  # --- 4. it follows the focus ---------------------------------------------------------------
  - id: second-window
    spawn:
      window: vi
      argv: ["{demo_bin}/foot-wayhint", "{demo_bin}/vi"]
    precondition: {overlay: visible}
    wait_for:
      context: {process_name: vi, active_sheet: vi}
      overlay: visible
    caption:
      en: "Another window, another command"
      ja: "別の窓で、別のコマンドを動かす"
    hold: 2.0

  - id: follow-focus
    key: super+h
    wait_for: {overlay: visible, label: "Vi", hints: 9}
    caption:
      en: "Super+H again: the sheet is replaced without the overlay closing"
      ja: "もう一度 Super+H。overlay は閉じずに sheet だけが差し替わる"
    hold: 3.5

  # --- 5. writing a hint without leaving the overlay ------------------------------------------
  - id: enter-edit
    key: super+ctrl+h
    precondition: {overlay: visible}
    wait_for:
      overlay: visible
      label: "a add · Enter edit · dd delete · u undo · f favorite · J/K move · Esc leave"
    caption:
      en: "Super+Ctrl+H — edit mode, for the hint you just learned"
      ja: "Super+Ctrl+H — いま覚えたことを、その場で書き足す"
    hold: 2.5

  - id: open-form
    key: a
    wait_for: {overlay: visible, label: "Title"}
    caption:
      en: "a — add a hint to the sheet on screen"
      ja: "a — 表示中の sheet に hint を足す"
    hold: 1.5

  - id: type-title
    type: {en: "Repeat the last search", ja: "直前の検索を繰り返す"}
    wait_for: {overlay: visible, label: "Title"}
    caption:
      en: "The title, then Tab"
      ja: "title を書いて Tab"
    hold: 2.0

  - id: next-field
    key: tab
    wait_for: {overlay: visible, label: "Key"}
    hold: 0.6

  - id: type-key
    type: "n"
    wait_for: {overlay: visible, label: "Key"}
    caption:
      en: "and the key it is on"
      ja: "続けてキーを書く"
    hold: 2.0

  - id: save-hint
    key: enter
    wait_for: {overlay: visible, no_label: "Title", hints: 10}
    caption:
      en: "Enter writes it into the sheet's YAML file and the list shows it straight away"
      ja: "Enter で sheet の YAML に書かれ、一覧にもすぐ出る"
    hold: 3.5

  # --- 6. a broken sheet does not break the overlay -------------------------------------------
  - id: break-yaml
    write:
      file: "hints/{lang}/foot.yaml"
      text: |
        id: foot
        title: Terminal
        hints:
          - {id: broken, title: [
    precondition: {overlay: visible}
    wait_for: {overlay: visible, label: "YAML error"}
    caption:
      en: "Edited by hand and left invalid: the last good version stays on screen"
      ja: "手で編集して壊しても、最後に読めた内容が残る"
    hold: 3.0

  - id: fix-yaml
    write:
      file: "hints/{lang}/foot.yaml"
      source: "fixtures/hints/{lang}/foot.yaml"
    wait_for: {overlay: visible, no_label: "YAML error", hints: 10}
    caption:
      en: "Fix the file and it comes back, without restarting anything"
      ja: "直せばそのまま復帰する。再起動は要らない"
    hold: 3.0

  - id: close
    key: super+h
    precondition: {overlay: visible}
    wait_for: {overlay: hidden}
    caption:
      en: "Super+H — and it is gone"
      ja: "Super+H で消える"
    hold: 1.5
