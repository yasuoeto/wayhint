# The gui showcase, as a script: the route with nothing to look into. A GTK application has no
# foreground process to read out of a terminal, so the window's app_id is the whole answer
# (DECISIONS 0024). 01_gui_storyboard.md says what it argues.
#
# The window is the demo's own GTK4 stub. No real application is started: what it draws has to
# be the same in every recording, and its name and logo are not ours to use.

output: {width: 1280, height: 720, fps: 30}
fonts: {ui: "Noto Sans CJK JP", mono: "Noto Sans Mono"}
session: {herdr: false}

windows:
  - {title: Notes, app_id: "dev.wayhint.demo.Notes", x: 28, y: 40, width: 630, height: 562}
  # The terminal `wayhint context --shown` is read in, over the lower half of Notes and clear
  # of the overlay: what it prints is about the overlay, so both have to be in view.
  - {title: shown, x: 40, y: 292, width: 620, height: 310}

steps:
  - id: open-notes
    spawn: {window: Notes, argv: [notes]}
    wait_for:
      toplevel: "^dev\\.wayhint\\.demo\\.Notes$"
      context: {active_sheet: notes}
      overlay: hidden
      timeout: 30
    caption: {ja: "GUI アプリでも同じ"}
    hold: 5.0

  - id: notes-hints
    key: super+h
    wait_for:
      context: {active_sheet: notes}
      overlay: visible
      label: "Notes"
      hints: 9
    caption: {ja: "ウィンドウの app_id だけで選ぶ。プロセスは探さない"}
    hold: 8.0

  - id: sub-header
    pause: true
    wait_for: {overlay: visible, label: "Notes", no_label: "python3"}
    caption: {ja: "覗き込むプロセスが無いので、sub-header は app_id"}
    hold: 8.0

  - id: yaml-wayland
    pause: true
    wait_for: {overlay: visible, label: "Notes"}
    caption: {ja: "match.wayland に app_id を書くだけ"}
    hold: 7.0

  - id: context-cli
    # The terminal opens over Notes and takes the focus; the overlay stays as it was opened,
    # and `--shown` reports that one (docs/SHEETS.md §6). A plain `context` typed here would
    # answer for the terminal instead.
    spawn: {window: shown, argv: [foot-wayhint, -e, wayhint-shown]}
    wait_for:
      context: {process_name: wayhint-shown}
      overlay: visible
      label: "Notes"
      timeout: 30
    caption: {ja: "wayhint context --shown の desktop_app と突き合わせる"}
    hold: 9.0

  - id: close-shown
    # Back to the window the overlay was opened for, so that the hotkey below hides it. Pressed
    # from the terminal, it would count as another window's and replace the list instead.
    close: {window: shown}
    wait_for: {overlay: visible, context: {active_sheet: notes}, timeout: 20}
    hold: 1.0

  - id: outro
    key: super+h
    wait_for: {overlay: hidden}
    caption: {ja: "Herdr の中・端末の中・GUI、どこで動いていても、ヒントは自動で切り替わる"}
    hold: 7.0

variants:
  main:
    target: 45
    tolerance: 5
    steps:
      - open-notes
      - notes-hints
      - sub-header
      - yaml-wayland
      - context-cli
      - close-shown
      - outro
