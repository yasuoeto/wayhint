# The herdr showcase, as a script: one of the three routes wayhint has to a context, and the
# only one that asks another program. 01_herdr_storyboard.md says what it argues; this file
# says what the recorder does (DECISIONS 0032).
#
# What the product *does* with the hints it found is not argued here -- that is `common`. This
# one stays on one question: which sheet, and how was it chosen.

output: {width: 1280, height: 720, fps: 30}
fonts: {ui: "Noto Sans CJK JP", mono: "Noto Sans Mono"}
session: {herdr: true}

# Every window ends above the caption band (`tools/demo/encode.py`, demo/README「字幕帯」):
# at 720p the band starts at y=638, so nothing the compositor draws may reach past y=634.
windows:
  - {title: Herdr, x: 32, y: 48, width: 620, height: 566}
  - {title: vi, x: 104, y: 214, width: 560, height: 380}
  # The terminal `wayhint context --shown` is read in. Low on the screen and over the Herdr
  # window, not the overlay: what it prints is about the overlay, so both have to be in view.
  - {title: shown, x: 40, y: 292, width: 620, height: 310}
  # The launch lines of docs/TERMINALS.md. Wide: no overlay is up yet, and the Ghostty line is
  # about 80 columns.
  - {title: launch, x: 36, y: 214, width: 1200, height: 200}

steps:
  - id: intro
    spawn: {window: Herdr, argv: [foot-herdr]}
    wait_for:
      toplevel: "^foot-herdr$"
      context: {active_sheet: herdr}
      overlay: hidden
      timeout: 40
    caption: {ja: "Herdr の中を見る"}
    hold: 4.0

  - id: precondition
    # Before the first hotkey, as in the terminal showcase: the setup comes before the use.
    spawn: {window: launch, argv: [foot-wayhint, -e, herdr-launch]}
    wait_for:
      context: {process_name: herdr-launch}
      overlay: hidden
      timeout: 30
    caption: {ja: "前準備: Herdr は、名前に herdr を付けた端末で開く"}
    hold: 8.0

  - id: close-launch
    close: {window: launch}
    wait_for: {context: {active_sheet: herdr}, overlay: hidden, timeout: 20}
    hold: 1.0

  - id: start-claude
    herdr: [pane, run, "w1:p1", claude]
    wait_for:
      context: {active_sheet: claude-code, process_name: claude}
      overlay: hidden
      timeout: 30
    hold: 3.0

  - id: claude-hints
    key: super+h
    wait_for:
      context: {active_sheet: claude-code, process_name: claude}
      overlay: visible
      label: "Claude Code"
      hints: 15
    caption: {ja: "Herdr にフォーカス中のタブを聞き、動いているプロセスを取る"}
    hold: 8.0

  - id: parent-follows
    pause: true
    wait_for: {overlay: visible, label: "中クリックペースト"}
    caption: {ja: "親子関係のプロセスは自動でヒントを混ぜる、Herdr の操作も並ぶ"}
    hold: 7.0

  - id: parent-all
    pause: true
    wait_for: {overlay: visible, label: "中クリックペースト", hints: 15}
    caption: {ja: "何も書かなければ、親に当たる Herdr のヒントが全て一緒に表示される"}
    hold: 8.0

  - id: new-tab-codex
    herdr: [tab, create, --focus]
    wait_for: {context: {active_sheet: herdr}, overlay: visible, timeout: 20}
    hold: 1.0

  - id: start-codex
    # Codex is running and the overlay still says Claude Code. Said out loud, because without it
    # the next caption reads as if the overlay were late.
    herdr: [pane, run, "w1:p2", codex]
    wait_for:
      context: {active_sheet: codex, process_name: codex}
      overlay: visible
      label: "Claude Code"
      timeout: 30
    caption: {ja: "ヒント画面は、押し直すまで前のタブのまま"}
    hold: 5.0

  - id: codex-hints
    key: super+h
    wait_for:
      context: {active_sheet: codex, process_name: codex}
      overlay: visible
      label: "Codex"
      hints: 9
    caption: {ja: "タブを移って押し直せば、そのタブのシート"}
    hold: 8.0

  - id: new-tab-idle
    herdr: [tab, create, --focus]
    wait_for: {context: {active_sheet: herdr}, overlay: visible, timeout: 20}
    hold: 2.0

  - id: idle-hints
    key: super+h
    wait_for:
      context: {active_sheet: herdr}
      overlay: visible
      label: "Herdr"
      hints: 8
    caption: {ja: "動いているプロセスに対応したシートが無ければ、Herdr のヒントが全部出る"}
    hold: 8.0

  - id: close-hints
    key: super+h
    wait_for: {overlay: hidden}
    hold: 2.0

  - id: narrow-yaml
    # herdr.yaml with `nested.export_categories` added under `match` (narrowed/ is the fixture
    # plus those two lines; tests/test_demo_scenario.py keeps it that way). Written before vi
    # opens it, so the file on screen is the one that narrows the next list.
    write:
      file: "hints/{lang}/herdr.yaml"
      source: "showcases/herdr/narrowed/{lang}/herdr.yaml"
    wait_for:
      unchecked: "the reload shows only in the list of narrowed-hints, which checks it"
    hold: 0

  - id: open-yaml
    # A window of its own rather than a pane: a file argument cannot go through
    # `herdr pane run` (the allow list takes a pane id and a command, and nothing else).
    spawn: {window: vi, argv: [foot-wayhint, -e, vi, "hints/{lang}/herdr.yaml"]}
    wait_for: {context: {active_sheet: vi, process_name: vi}, overlay: hidden, timeout: 30}
    hold: 3.0

  - id: yaml-export
    pause: true
    wait_for: {context: {active_sheet: vi}}
    caption: {ja: "表示内容を絞り込みたい場合は、設定を書く"}
    hold: 8.0

  - id: close-yaml
    close: {window: vi}
    wait_for: {context: {active_sheet: herdr}, overlay: hidden, timeout: 20}
    hold: 2.0

  - id: back-to-claude
    herdr: [tab, focus, "w1:t1"]
    wait_for: {context: {active_sheet: claude-code, process_name: claude}, overlay: hidden}
    hold: 2.0

  - id: narrowed-hints
    # 15 before: 7 of Claude Code, 6 of Herdr, 2 of wm. scroll and input leave 3 of Herdr's.
    key: super+h
    wait_for:
      context: {active_sheet: claude-code, process_name: claude}
      overlay: visible
      label: "Claude Code"
      no_label: "Cycle theme"
      hints: 12
    caption: {ja: "Herdr のヒントは scroll と input だけになる"}
    hold: 8.0

  - id: context-cli
    # The terminal opens over Herdr and takes the focus; the overlay stays as it was opened, and
    # `--shown` reports that one (docs/SHEETS.md §6).
    spawn: {window: shown, argv: [foot-wayhint, -e, wayhint-shown]}
    wait_for:
      context: {process_name: wayhint-shown}
      overlay: visible
      label: "Claude Code"
      timeout: 30
    caption: {ja: "wayhint context --shown で、どこで絞ったかが分かる"}
    hold: 9.0

  - id: close-shown
    # Back to the window the overlay was opened for, so that the hotkey below hides it. Pressed
    # from the terminal, it would count as another window's and replace the list instead.
    close: {window: shown}
    wait_for: {overlay: visible, context: {active_sheet: claude-code}, timeout: 20}
    hold: 1.0

  - id: outro
    key: super+h
    wait_for: {overlay: hidden}
    caption: {ja: "Herdr の中・端末の中・GUI、どこで動いていても、ヒントは自動で切り替わる"}
    hold: 7.0

variants:
  main:
    target: 105
    tolerance: 10
    steps:
      - intro
      - precondition
      - close-launch
      - start-claude
      - claude-hints
      - parent-follows
      - parent-all
      - new-tab-codex
      - start-codex
      - codex-hints
      - new-tab-idle
      - idle-hints
      - close-hints
      - narrow-yaml
      - open-yaml
      - yaml-export
      - close-yaml
      - back-to-claude
      - narrowed-hints
      - context-cli
      - close-shown
      - outro
