# The terminal showcase, as a script: the route that does not ask anybody -- wayhint reads the
# window's own app_id for the pid and then /proc for what that pid is running.
# 01_terminal_storyboard.md says what it argues; this file says what the recorder does.
#
# No Herdr in this session (`session.herdr: false`). That is the point of the showcase: a plain
# terminal, no multiplexer, and the sheet still follows what is running inside the window.

output: {width: 1280, height: 720, fps: 30}
fonts: {ui: "Noto Sans CJK JP", mono: "Noto Sans Mono"}
session: {herdr: false}

# Two windows, both clear of the overlay (x < 690) and of the caption band (y < 634), and
# offset so that both are on screen at once -- "two windows, two processes" is the claim.
windows:
  - {title: less, x: 36, y: 56, width: 560, height: 380}
  - {title: vi, x: 112, y: 240, width: 560, height: 380}
  # The terminal `./scripts/setup-terminals` is read in. Wide, because no overlay is on screen
  # while it is up and its longest line (the Ghostty .desktop) is about 80 columns; tall enough
  # for four terminals' worth of output (about 20 lines) and still clear of the caption band.
  - {title: setup, x: 36, y: 56, width: 1200, height: 480}
  # The terminal `wayhint context --shown` is read in, over the other two and clear of the
  # overlay: what it prints is about the overlay, so both have to be in view.
  - {title: shown, x: 40, y: 292, width: 620, height: 310}

steps:
  - id: intro
    # `wm.yaml` rather than a sheet about another program: this showcase has no Herdr in it,
    # and the first thing on screen should not be a file about one.
    spawn: {window: less, argv: [foot-wayhint, -e, less, "hints/{lang}/wm.yaml"]}
    wait_for:
      context: {active_sheet: less, process_name: less}
      overlay: hidden
      timeout: 30
    caption: {ja: "herdr などの multiplexer を使っていない端末でも", en: "Even in a terminal with no multiplexer like herdr"}
    hold: 5.0

  - id: supported
    pause: true
    wait_for: {overlay: hidden}
    caption: {ja: "foot / kitty / Ghostty / Alacritty に対応", en: "Supports foot / kitty / Ghostty / Alacritty"}
    hold: 6.0

  # --- the one step of setup, before it is used ------------------------------------------------
  - id: open-setup
    # The real dry run in the session's throwaway home: it writes nothing (docs/TERMINALS.md).
    spawn: {window: setup, argv: [foot-wayhint, -e, setup-dry-run]}
    wait_for:
      context: {process_name: setup-dry-run}
      overlay: hidden
      timeout: 30
    caption: {ja: "端末で使うには、前準備が 1 つ要る", en: "Using it in a terminal needs one setup step"}
    hold: 6.0

  - id: setup-oneshot
    pause: true
    wait_for: {context: {process_name: setup-dry-run}}
    caption: {ja: "準備は scripts/setup-terminals 一発。既定は確認だけ", en: "One command, scripts/setup-terminals. Default just checks"}
    hold: 7.0

  - id: close-setup
    close: {window: setup}
    wait_for: {context: {active_sheet: less, process_name: less}, timeout: 20}
    hold: 1.0

  # --- in use -----------------------------------------------------------------------------------
  - id: less-hints
    key: super+h
    wait_for:
      context: {active_sheet: less, process_name: less}
      overlay: visible
      label: "Less"
      hints: 6
    caption: {ja: "端末の中で動いているプロセスのヒントが出る", en: "Shows hints for the process running in the terminal"}
    hold: 8.0

  - id: open-vi
    # The new window takes the focus, which is what the next two steps are about. Nothing
    # switches windows with a key here: the compositor's own bindings are not part of the
    # product, and a recording must not depend on which ones a labwc version ships.
    spawn: {window: vi, argv: [foot-wayhint, -e, vi, "hints/{lang}/less.yaml"]}
    wait_for:
      context: {active_sheet: vi, process_name: vi}
      overlay: visible
      timeout: 30
    hold: 3.0

  - id: how-two-windows
    pause: true
    wait_for: {overlay: visible, label: "Less"}
    caption: {ja: "ウィンドウが 2 枚でも、それぞれの中身を取り違えない", en: "Two windows, and it never mixes up their contents"}
    hold: 7.0

  - id: vi-hints
    key: super+h
    wait_for:
      context: {active_sheet: vi, process_name: vi}
      overlay: visible
      label: "Vi"
      hints: 5
    caption: {ja: "別のウィンドウで押し直せば、その一番前のプロセスのヒント", en: "Press again in another window for its frontmost process"}
    hold: 8.0

  # --- the terminal's own hints -----------------------------------------------------------------
  - id: write-foot
    # A sheet for the terminal itself, `^foot$` as it is written for a window whose app_id is
    # `foot.p<pid>`. Only in the session's copy: `demo/fixtures/` has no foot sheet, so the
    # scenes before this one are not changed by it.
    write:
      file: "hints/{lang}/foot.yaml"
      source: "showcases/terminal/foot/{lang}/foot.yaml"
    wait_for:
      unchecked: "the new sheet shows only in the list of foot-mixed, which checks it"
    hold: 0

  - id: close-vi
    close: {window: vi}
    wait_for: {context: {active_sheet: less, process_name: less}, timeout: 20}
    hold: 1.0

  - id: foot-sheet
    # The same vi window again, now on the file just written, so the terminal's own hints are
    # what is on screen while the caption talks about them.
    spawn: {window: vi, argv: [foot-wayhint, -e, vi, "hints/{lang}/foot.yaml"]}
    wait_for:
      context: {active_sheet: vi, process_name: vi}
      timeout: 30
    caption: {ja: "端末自体のヒント（コピー・貼り付け）も書ける", en: "The terminal's own hints (copy, paste) can be written too"}
    hold: 8.0

  - id: foot-mixed
    # vi.yaml's 3, Foot's 3 and wm's 2: the terminal's sheet is the parent of the process's.
    key: super+h
    wait_for:
      context: {active_sheet: vi, process_name: vi}
      overlay: visible
      label: {ja: "スクロールバックを検索", en: "Search the scrollback"}
      hints: 8
    caption: {ja: "一番前のプロセスのヒントと一緒に出る", en: "Shows together with the frontmost process's hints"}
    hold: 8.0

  # --- when it does not work ------------------------------------------------------------------
  - id: context-cli
    # The terminal opens over the other two and takes the focus; the overlay stays as it was
    # opened, and `--shown` reports that one (docs/SHEETS.md §6).
    spawn: {window: shown, argv: [foot-wayhint, -e, wayhint-shown]}
    wait_for:
      context: {process_name: wayhint-shown}
      overlay: visible
      label: {ja: "スクロールバックを検索", en: "Search the scrollback"}
      timeout: 30
    caption: {ja: "出ないときは wayhint context --shown で確かめる", en: "Nothing showing? Check wayhint context --shown"}
    hold: 9.0

  - id: close-shown
    # Back to the window the overlay was opened for, so that the hotkey below hides it. Pressed
    # from the terminal, it would count as another window's and replace the list instead.
    close: {window: shown}
    wait_for: {overlay: visible, context: {active_sheet: vi}, timeout: 20}
    hold: 1.0

  - id: outro
    key: super+h
    wait_for: {overlay: hidden}
    caption: {ja: "Herdr の中・端末の中・GUI、どこで動いていても、ヒントは自動で切り替わる", en: "In Herdr, in a terminal or in a GUI app, the hints switch by themselves"}
    hold: 7.0

variants:
  main:
    target: 85
    tolerance: 9
    steps:
      - intro
      - supported
      - open-setup
      - setup-oneshot
      - close-setup
      - less-hints
      - open-vi
      - how-two-windows
      - vi-hints
      - write-foot
      - close-vi
      - foot-sheet
      - foot-mixed
      - context-cli
      - close-shown
      - outro
