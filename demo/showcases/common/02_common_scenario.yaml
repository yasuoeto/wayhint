# The herdr showcase, as a script. 01_herdr_storyboard.md says what this argues and why; this
# file says what the recorder does. When the two disagree about wording or seconds, change this
# one and copy the result back into the storyboard. When they disagree about *what to show*,
# stop and ask -- the storyboard is the one that decides that (DECISIONS 0032).
#
# `steps` defines every moment once. A `variant` is a list of step ids and has to be a complete
# sequence on its own: the 60-second cut repeats the opening steps with its own shorter holds
# rather than borrowing state from the longer ones.

output: {width: 1280, height: 720, fps: 30}
fonts: {ui: "Noto Sans CJK JP", mono: "Noto Sans Mono"}

# Every window ends above the caption band (`tools/demo/encode.py`, demo/README「字幕帯」):
# at 720p the band starts at y=638, so nothing the compositor draws may reach past y=634.
windows:
  - {title: Herdr, x: 32, y: 48, width: 620, height: 566}
  - {title: vi, x: 104, y: 214, width: 560, height: 380}
  # Big enough to cover the Herdr window underneath it: the GUI scene is about *this*
  # window, and a strip of terminal behind it only asks what it is doing there.
  - {title: Notes, app_id: "dev.wayhint.demo.Notes", x: 28, y: 40, width: 630, height: 562}

steps:
  # =============================================================================================
  # 4 つの variant(overview / search / edit / sheets)が使い回す step。どの variant も
  # 単独で見られる 1 本なので、それぞれ Herdr と Claude Code の起動から始まる。overview 以外は
  # 下の boot-* で字幕なしに起動する(overview の §1 の字幕を 4 回見せないため)。
  # =============================================================================================

  # --- 字幕なしの起動(search / edit / sheets の冒頭) -----------------------------------------------
  - id: boot-herdr
    spawn: {window: Herdr, argv: [foot-herdr]}
    wait_for:
      toplevel: "^foot-herdr$"
      context: {active_sheet: herdr}
      overlay: hidden
      timeout: 40
    hold: 1.0

  - id: boot-claude
    herdr: [pane, run, "w1:p1", claude]
    wait_for:
      context: {active_sheet: claude-code, process_name: claude}
      overlay: hidden
      timeout: 30
    hold: 2.0

  # --- §1 課題 ---------------------------------------------------------------------------------
  - id: open-herdr
    spawn: {window: Herdr, argv: [foot-herdr]}
    wait_for:
      toplevel: "^foot-herdr$"
      context: {active_sheet: herdr}
      overlay: hidden
      timeout: 40
    caption: {ja: "Herdr の中で Claude Code を動かしている"}
    hold: 3.0

  - id: start-claude
    herdr: [pane, run, "w1:p1", claude]
    wait_for:
      context: {active_sheet: claude-code, process_name: claude}
      overlay: hidden
      timeout: 30
    caption: {ja: "操作を忘れるたびに、Web で検索する"}
    hold: 5.0

  - id: nothing-remains
    pause: true
    wait_for: {overlay: hidden}
    caption: {ja: "調べたことが、どこにも残らない"}
    hold: 5.0

  - id: wrong-hints
    pause: true
    wait_for: {overlay: hidden}
    caption: {ja: "欲しいのは、いま動いているもののヒント"}
    hold: 5.0

  # --- §2 いつも同じ場所 -------------------------------------------------------------------------
  - id: show-hints
    key: super+h
    wait_for: {overlay: visible, label: "Claude Code", hints: 15}
    caption: {ja: "hotkey 一発で、フォーカス中のウィンドウのヒント。位置は設定可能"}
    hold: 6.0

  - id: list-layout
    cli: refresh
    wait_for: {overlay: visible, label: "Claude Code"}
    caption: {ja: "左にキー、中央に説明（あればコマンド）、右に分類"}
    hold: 4.0

  - id: detail-pane
    cli: refresh
    wait_for:
      overlay: visible
      label: "Claude Code"
      unchecked: "画面は前の step のまま。字幕だけが進む"
    caption: {ja: "補足情報は下に出る"}
    hold: 4.0

  # --- §3 主役1: 中まで見て切り替わる -------------------------------------------------------------
  - id: whose-hints
    cli: refresh
    wait_for:
      overlay: visible
      label: "Claude Code"
      unchecked: "画面は前の step のまま。次の場面への言い渡しだけが進む"
    caption: {ja: "見ているのはウィンドウではなく、一番前のプロセス"}
    hold: 5.0

  - id: new-tab
    herdr: [tab, create, --focus]
    wait_for: {context: {active_sheet: herdr}, overlay: visible, timeout: 20}
    hold: 2.0

  - id: start-codex
    herdr: [pane, run, "w1:p2", codex]
    wait_for:
      context: {active_sheet: codex, process_name: codex}
      overlay: visible
      timeout: 30
    hold: 3.0

  - id: switch-pane
    key: super+h
    wait_for: {overlay: visible, label: "Codex", hints: 9}
    caption: {ja: "別のタブで押し直せば、閉じずに差し替わる"}
    hold: 8.0

  - id: parent-hints
    cli: refresh
    wait_for: {overlay: visible, label: "Codex"}
    caption: {ja: "親子関係にあるプロセスのヒントを同時に表示する、親である Herdr の操作も並ぶ"}
    hold: 8.0

  # --- §4 主役2: 奪わない(search)/ §5 主役3(edit)の入口 --------------------------------------
  # The Claude Code pane: its sheet is the one with commands to copy (codex.yaml and herdr.yaml
  # hold keys only, and a key is not copied -- DECISIONS 0039).
  - id: search-intro
    # search's own opening: the caption says what this video is about (the variant starts on
    # its own, without overview's §1).
    key: super+h
    wait_for: {overlay: visible, label: "Claude Code", hints: 15}
    caption: {ja: "ヒントを探して、そのまま使う"}
    hold: 4.0

  - id: edit-intro
    # edit's own opening, as search-intro is search's.
    key: super+h
    wait_for: {overlay: visible, label: "Claude Code", hints: 15}
    caption: {ja: "足りないヒントは、自分で足していく"}
    hold: 4.0

  - id: keep-typing
    type: "write tests"
    precondition: {overlay: visible}
    wait_for:
      overlay: visible
      unchecked: "文字が出るのは端末の中で、overlay は変わらないのが正しい。証拠は frame にしかない"
    caption: {ja: "ヒント画面を出したまま、そのまま入力できる"}
    hold: 8.0

  - id: erase-line
    key: ctrl+u
    wait_for:
      overlay: visible
      unchecked: "端末の行が消えるだけで overlay は変わらない。証拠は frame にしかない"
    hold: 1.0

  - id: open-search
    key: super+shift+h
    precondition: {overlay: visible}
    wait_for: {button: done}
    caption: {ja: "検索は Super+Shift+H"}
    hold: 2.5

  - id: type-search
    # A category, so that more than one row is left and ↓ has somewhere to go: model, compact
    # and clear are the session hints of claude-code.yaml.
    type: "session"
    wait_for: {overlay: visible, hints: 3, text: "session"}
    caption: {ja: "キーボードの入力先を切り替えるのは、検索を始めたときだけ"}
    hold: 7.0

  - id: to-list
    # Lands on the first row, model: its remark is what the detail pane shows.
    key: down
    wait_for:
      overlay: visible
      hints: 3
      label: "c copy and leave · Enter/Esc leave · ↓ list · Tab category"
    caption: {ja: "↓ で一覧へ。使えるキーは下に出る"}
    hold: 4.5

  - id: move-down
    # One row down, to compact. Its remark in the detail pane is the proof the selection moved.
    key: down
    wait_for: {overlay: visible, hints: 3, label: "Keeps the summary, drops raw tool output."}
    caption: {ja: "一覧では ↑↓ でヒントを選ぶ"}
    hold: 3.5

  - id: copy-and-leave
    key: c
    wait_for: {button: search, hints: 3}
    caption: {ja: "c で選択中のヒントのコマンドをコピーして元のウィンドウに戻る"}
    hold: 4.5

  - id: paste
    key: ctrl+shift+v
    wait_for:
      overlay: visible
      hints: 3
      unchecked: "端末に /compact が貼られたかは frame にしか出ない"
    caption: {ja: "絞り込みは残り、入力は元のウィンドウへ"}
    hold: 5.5

  # Another sheet, and back: the filter belongs to the Claude Code sheet, not to the overlay.
  - id: other-tab
    herdr: [tab, create, --focus]
    wait_for: {context: {active_sheet: herdr}, overlay: visible, timeout: 20}
    hold: 1.0

  - id: other-sheet
    key: super+h
    wait_for: {overlay: visible, label: "Herdr", hints: 8}
    caption: {ja: "別のシートには、絞り込みは掛からない"}
    hold: 5.0

  - id: back-tab
    herdr: [tab, focus, "w1:t1"]
    wait_for: {context: {active_sheet: claude-code}, overlay: visible, timeout: 20}
    hold: 1.0

  - id: back-filtered
    key: super+h
    wait_for: {overlay: visible, label: "Claude Code", hints: 3}
    caption: {ja: "戻ると、絞り込みはそのまま"}
    hold: 5.0

  - id: clear-filter
    press: {button: clear-filter}
    precondition: {overlay: visible, hints: 3}
    wait_for: {overlay: visible, hints: 15}
    caption: {ja: "絞り込みはシートごとに残る。解除は × か、検索ボックスを空にする"}
    hold: 6.0

  # --- §5 主役3: その場で育てる -------------------------------------------------------------------
  - id: edit-mode
    key: super+ctrl+h
    precondition: {overlay: visible}
    wait_for:
      overlay: visible
      label: "a add · Enter edit · dd delete · u undo · f favorite · J/K move · Esc leave"
    caption: {ja: "忘れていた操作を見つけたら、その場で書く"}
    hold: 5.0

  - id: open-form
    key: a
    wait_for: {overlay: visible, label: "Title"}
    caption: {ja: "追加先は、いま選んでいるヒントと同じシート"}
    hold: 4.0

  - id: type-title
    type: "権限モードを切り替える"
    wait_for: {overlay: visible, label: "Title", text: "権限モードを切り替える"}
    hold: 3.5

  - id: next-field
    key: tab
    wait_for: {overlay: visible, label: "Key"}
    hold: 0.6

  - id: type-key
    type: "Shift+Tab"
    wait_for: {overlay: visible, label: "Key", text: "Shift+Tab"}
    hold: 3.5

  - id: save-hint
    key: enter
    wait_for: {overlay: visible, no_label: "Title", hints: 16}
    caption: {ja: "Enter で保存すると編集モードは終わる"}
    hold: 7.0

  - id: break-yaml
    # herdr.yaml with the `]` of line 5 gone (broken/ is the fixture with that one change;
    # tests/test_demo_scenario.py keeps it so). herdr.yaml rather than claude-code.yaml: the
    # hint just added lives in claude-code.yaml, and putting the fixture back would drop it.
    # Herdr's hints are in this list too, so the error is about what is on screen.
    write:
      file: "hints/{lang}/herdr.yaml"
      source: "showcases/common/broken/{lang}/herdr.yaml"
    precondition: {overlay: visible}
    wait_for: {overlay: visible, label: "YAML error"}
    hold: 0

  - id: open-broken
    # The broken line on screen while the caption says it was broken by hand. vi takes the
    # focus; the overlay stays, with the error above the list it last read.
    spawn: {window: vi, argv: [foot-wayhint, -e, vi, "hints/{lang}/herdr.yaml"]}
    wait_for:
      context: {active_sheet: vi, process_name: vi}
      overlay: visible
      label: "YAML error"
      timeout: 30
    caption: {ja: "手で編集して壊しても、最後に読めた内容が残る"}
    hold: 7.0

  - id: close-broken
    close: {window: vi}
    wait_for: {context: {active_sheet: claude-code}, overlay: visible, timeout: 20}
    hold: 1.0

  - id: fix-yaml
    write:
      file: "hints/{lang}/herdr.yaml"
      source: "fixtures/hints/{lang}/herdr.yaml"
    # 16: the list is back, with the hint added above still in it.
    wait_for: {overlay: visible, no_label: "YAML error", hints: 16}
    caption: {ja: "直せばそのまま復帰する。再起動は要らない"}
    hold: 7.0

  # --- §6 締め ----------------------------------------------------------------------------------
  - id: close
    key: super+h
    precondition: {overlay: visible}
    wait_for: {overlay: hidden}
    caption: {ja: "忘れた瞬間、いつも同じ場所に、必要な情報がある"}
    hold: 6.0

  - id: stack
    pause: true
    wait_for: {overlay: hidden}
    caption: {ja: "Wayland (labwc) / GTK4 / ヒントは YAML"}
    hold: 6.0

  # --- sheets: シートの書き方 ----------------------------------------------------------------------
  - id: open-yaml
    spawn: {window: vi, argv: [foot-wayhint, -e, vi, "hints/{lang}/claude-code.yaml"]}
    wait_for: {context: {active_sheet: vi, process_name: vi}, timeout: 30}
    caption: {ja: "シートは 1 アプリ 1 YAML"}
    hold: 7.0

  - id: yaml-match
    pause: true
    wait_for: {context: {active_sheet: vi}}
    caption: {ja: "match でどのウィンドウ・どのプロセスに出すかが決まる"}
    hold: 8.0

  - id: close-yaml
    close: {window: vi}
    wait_for: {context: {active_sheet: claude-code}, overlay: hidden, timeout: 20}
    hold: 1.0

  - id: sheet-hints
    # What the file just shown does: the Claude Code sheet, chosen by its match.
    key: super+h
    wait_for: {overlay: visible, label: "Claude Code", hints: 15}
    caption: {ja: "match に当たったシートのヒントが出る"}
    hold: 7.0

  - id: open-config
    # config.yaml, with `include: [wm]` and `appearance.language: ja` both within vi's 14 lines.
    # vi takes the focus; the overlay stays, so the UI's language is on screen as well.
    spawn: {window: vi, argv: [foot-wayhint, -e, vi, "config.yaml"]}
    wait_for: {context: {active_sheet: vi, process_name: vi}, overlay: visible, timeout: 30}
    caption: {ja: "共通のヒントは config.yaml の include で全シートに混ぜる"}
    hold: 8.0

  - id: config-lang
    pause: true
    wait_for: {context: {active_sheet: vi}, overlay: visible}
    caption: {ja: "ヒントは言語ごと。UI と同じ言語が出る"}
    hold: 8.0

  - id: close-config
    close: {window: vi}
    wait_for: {context: {active_sheet: claude-code}, overlay: visible, timeout: 20}
    hold: 1.0

  - id: idle-tab
    # A tab with nothing running: Herdr's own 6 hints and wm's 2, short enough that the end of
    # the list is on screen (Claude Code's 15 push wm's below the fold).
    herdr: [tab, create, --focus]
    wait_for: {context: {active_sheet: herdr}, overlay: visible, timeout: 20}
    hold: 1.0

  - id: wm-at-end
    key: super+h
    wait_for: {overlay: visible, label: "次の窓へ", hints: 8}
    caption: {ja: "共通のヒントは、どのシートでも末尾に並ぶ"}
    hold: 7.0

  - id: sheets-close
    key: super+h
    wait_for: {overlay: hidden}
    hold: 1.0

  - id: no-scrape
    pause: true
    wait_for: {overlay: hidden}
    caption: {ja: "やらないこと: コマンドの実行・AI 生成・画面の読み取り"}
    hold: 8.0

# =================================================================================================
# 尺は storyboard の尺割りから引く。--dry-run が target ± tolerance を判定し、外れたら止まる。
# 尺の variant は作らない(B-9)。4 つの variant は長さ違いではなく、中身で分けた別の 1 本
# (DECISIONS 0042)。どれも単独で完結する step 列を持つ。
# =================================================================================================
variants:
  overview:
    target: 78
    tolerance: 7
    steps:
      - open-herdr
      - start-claude
      - nothing-remains
      - wrong-hints
      - show-hints
      - list-layout
      - detail-pane
      - whose-hints
      - new-tab
      - start-codex
      - switch-pane
      - parent-hints
      - close
      - no-scrape
      - stack
  search:
    target: 68
    tolerance: 6
    steps:
      - boot-herdr
      - boot-claude
      - search-intro
      - keep-typing
      - erase-line
      - open-search
      - type-search
      - to-list
      - move-down
      - copy-and-leave
      - paste
      - other-tab
      - other-sheet
      - back-tab
      - back-filtered
      - clear-filter
      - close
  edit:
    target: 52
    tolerance: 6
    steps:
      - boot-herdr
      - boot-claude
      - edit-intro
      - edit-mode
      - open-form
      - type-title
      - next-field
      - type-key
      - save-hint
      - break-yaml
      - open-broken
      - close-broken
      - fix-yaml
      - close
  sheets:
    target: 58
    tolerance: 6
    steps:
      - boot-herdr
      - boot-claude
      - open-yaml
      - yaml-match
      - close-yaml
      - sheet-hints
      - open-config
      - config-lang
      - close-config
      - idle-tab
      - wm-at-end
      - sheets-close
      - stack
