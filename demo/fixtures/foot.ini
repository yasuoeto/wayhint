# The terminal the demo records. Everything that could differ between machines or blink
# between frames is pinned here: the font, the colours and the cursor. Both colour sections
# are written because foot picks one from the desktop's light/dark preference.
font=Noto Sans Mono:size=11
pad=14x12
[cursor]
style=block
blink=no
unfocused-style=unchanged
[colors-dark]
background=1c1c28
foreground=d6d6e0
[colors-light]
background=1c1c28
foreground=d6d6e0
