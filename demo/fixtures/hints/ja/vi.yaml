# Herdr が無くても端末の foreground process を /proc から見る、を示すための sheet。
id: vi
title: Vi
priority: 10
match:
  process:
    argv_regex: ["^vi$"]
include: [wm]
hints:
  - id: write-quit
    title: 保存して終了
    kind: command
    command: ":wq"
    category: ファイル
  - id: quit-hard
    title: 保存せずに終了
    kind: command
    command: ":q!"
    category: ファイル
  - id: undo
    title: 取り消す
    key: u
    category: 編集
