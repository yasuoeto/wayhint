# 窓そのものの sheet。端末の中でコマンドが動いているときは *親* になり、`terminal` タグの
# hint だけがコマンド側の hint に続く(config.yaml の nested.parent_tags)。デモの最初の場面。
id: foot
title: 端末
match:
  wayland:
    app_id_regex: ["^foot$"]
hints:
  - id: new-window
    title: 新しい窓
    key: Ctrl+Shift+N
    category: 端末
    tags: [terminal]
  - id: copy
    title: 選択範囲をコピー
    key: Ctrl+Shift+C
    category: 端末
    tags: [terminal]
  - id: scrollback
    title: 履歴を検索
    key: Ctrl+Shift+R
    category: 端末
  - id: font-size
    title: 文字を大きく
    key: Ctrl+plus
    category: 端末
