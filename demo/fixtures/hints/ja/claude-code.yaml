# Claude Code running inside Herdr. Matched on the foreground process, not on the window.
id: claude-code
title: Claude Code
priority: 10
match:
  process:
    argv_regex: ["^claude$"]
hints:
  - id: line-scroll
    title: 1行単位でのスクロール
    kind: shortcut
    key: Alt+↑/Alt+↓
    command:
    category: scroll
    tags:
    favorite: false
    copy:
    remark: 一行ずつスクロールする
    source:
    learned: '2026-09-18'
  - id: wheel-scroll
    title: ホイールマウス挙動でのスクロール
    kind: shortcut
    key: 中クリック+TrackPoint↑↓
    command:
    category: scroll
    tags:
    favorite: false
    copy:
    remark: 1行単位設定
    source:
    learned: '2026-09-18'
  - id: model
    title: モデル切り替え
    kind: command
    key:
    command: /model
    category: session
    tags:
    favorite: false
    copy:
    remark: モデル切り替え画面に遷移する
    source:
    learned:
  - id: compact
    title: ctwを圧縮する
    kind: command
    key:
    command: /compact
    category: session
    tags:
    favorite: false
    copy:
    remark: Keeps the summary, drops raw tool output.
    source:
    learned:
  - id: clear
    title: セッションのクリア
    kind: command
    key:
    command: /clear
    category: session
    tags:
    favorite: false
    copy:
    remark: セッションをクリアしctwを開放する
    source:
    learned: '2026-09-18'
  - id: prompt-editer
    title: プロンプトを入力に外部エディタを開く
    kind: shortcut
    key: Ctrl+G
    command:
    category: input
    tags:
    favorite: false
    copy:
    remark: '[pasted]なものも編集可能'
    source:
    learned: '2026-09-19'
  - id: shell-escape
    title: 実シェルでコマンドを実行する
    kind: tip
    key: "! <command>"
    category: input
    copy: "! "
