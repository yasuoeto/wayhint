# No `match`: this sheet is never chosen for a window. config.yaml lists it in `include`, so
# it is mixed into every sheet that does not say otherwise, and lands at the end of the list.
id: wm
title: Window manager
hints:
  - id: hints
    title: Show or hide this overlay
    key: Super+H
    category: wayhint
  - id: edit-mode
    title: Edit hints in the overlay
    key: Super+Ctrl+H
    category: wayhint
  - id: close-window
    title: Close the focused window
    key: Super+Shift+Q
    category: windows
