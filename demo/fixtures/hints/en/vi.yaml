# A second command, so the demo can show the overlay following the focus from one window to
# another without closing (scene 4).
id: vi
title: Vi
priority: 10
match:
  process:
    argv_regex: ["^vi$"]
inherit:
  parent_tags: [terminal]
include: [wm]
hints:
  - id: write-quit
    title: Save and quit
    kind: command
    command: ":wq"
    category: files
  - id: quit-hard
    title: Quit without saving
    kind: command
    command: ":q!"
    category: files
  - id: undo
    title: Undo
    key: u
    category: editing
  - id: search
    title: Search forwards
    kind: command
    command: /pattern
    category: editing
