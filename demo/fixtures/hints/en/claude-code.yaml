# Chosen by the *process* running in the terminal, not by the window (match.process).
id: claude-code
title: Claude Code
priority: 10
match:
  process:
    argv_regex: ["^claude$"]
inherit:
  parent_tags: [terminal]
include: [wm]
hints:
  - id: compact
    title: Compact the conversation
    kind: command
    command: /compact
    category: session
    remark: Keeps the summary, drops the raw tool output.
  - id: model
    title: Switch model
    kind: command
    command: /model
    category: session
  - id: resume
    title: Resume an earlier conversation
    kind: command
    command: /resume
    category: session
  - id: plan-mode
    title: Plan before editing
    key: Shift+Tab
    category: editing
  - id: shell-escape
    title: Run a shell command
    kind: tip
    key: "! <command>"
    category: editing
    copy: "! "
  - id: interrupt
    title: Interrupt the current turn
    key: Esc
    category: editing
