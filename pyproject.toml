[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expression
build-backend = "setuptools.build_meta"

[project]
name = "wayhint"
version = "1.0.0"
description = "Context-aware hint overlay for wlroots Wayland compositors (layer-shell, Herdr nested context)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Yasuo Eto", email = "yasuo@etou.org" }]
requires-python = ">=3.11"
keywords = ["wayland", "wlroots", "labwc", "wayfire", "gtk4", "layer-shell", "cheatsheet", "herdr"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]
dependencies = ["ruamel.yaml>=0.18", "pywayland>=0.4", "regex>=2022.1.18"]
# PyGObject / GTK4 / gtk4-layer-shell come from the distribution (see dev-docs/PHASE0.md).

[project.urls]
Homepage = "https://github.com/yasuoeto/wayhint"
Issues = "https://github.com/yasuoeto/wayhint/issues"

[project.optional-dependencies]
wayfire = ["wayfire>=0.6"]  # Wayfire IPC fallback backend (context.backend: wayfire)
dev = ["jsonschema>=4"]     # tests only: checks `wayhint schema` output against real sheets

[project.scripts]
wayhint = "wayhint.cli:main"
wayhintd = "wayhint.daemon:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
