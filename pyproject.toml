[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wayhint"
version = "0.1.0.dev0"
description = "Context-aware hint overlay for wlroots Wayland compositors (layer-shell, Herdr nested context)"
requires-python = ">=3.11"
dependencies = ["ruamel.yaml>=0.18", "pywayland>=0.4"]
# PyGObject / GTK4 / gtk4-layer-shell come from the distribution (see dev-docs/PHASE0.md).

[project.optional-dependencies]
wayfire = ["wayfire>=0.6"]  # Wayfire IPC fallback backend (context.backend: wayfire)
dev = ["jsonschema>=4"]     # tests only: checks `wayhint schema` output against real sheets

[project.scripts]
wayhint = "wayhint.cli:main"
wayhintd = "wayhint.daemon:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
