# Herdr (terminal multiplexer) — the parent sheet for nested contexts.
# With nothing written, every hint is also shown inside Claude/Codex. nested.export_tags narrows
# what is handed down (here: only the hints tagged terminal).
id: herdr
title: Herdr
match:
  wayland:
    app_id_regex: ["herdr"]
nested:
  export_tags: [terminal]
hints:
  - id: new-pane
    title: New pane
    key: Ctrl+Shift+N
    category: panes
    tags: [terminal]
    favorite: true
  - id: focus-next
    title: Focus next pane
    key: Ctrl+Shift+]
    category: panes
    tags: [terminal]
  - id: theme
    title: Cycle theme
    key: Ctrl+Shift+T
    category: appearance
