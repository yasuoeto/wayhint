overlay:
  anchor: top-right
  width: 420px
  height: 60%
  margin: {top: 0, right: 0}   # 画面端にぴったり付ける。離すなら整数(全辺)か {top,right,bottom,left}
appearance:
  style: style.css
  language: auto        # auto = マシンの locale(LC_ALL → LC_MESSAGES → LANG)。en | ja で固定可
editor:
  command: [gvim, --remote-silent, "+{line}", "{file}"]
nested:
  parent_tags: [terminal]
# include を書かない sheet すべてに混ぜる sheet。sheet 側に include: があればそちらが優先
# (足し算ではなく置き換え)。ここを [] にすれば「既定では何も混ぜない」。
include: [wm]
search:
  max_results: 30
logging:
  level: info
